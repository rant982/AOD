name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}
      - uses: actions/upload-artifact@v5
        with:
          name: aod-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="1.1.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "my-aod-$VER.apk"
          gh release create "build-${{ github.run_number }}" "my-aod-$VER.apk" \
            --title "My AOD $VER" --notes "$(git log -1 --pretty=%s)" --latest
