name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aod.keystore"
            echo "AOD_KEYSTORE=$RUNNER_TEMP/aod.keystore" >> "$GITHUB_ENV"
            echo "AOD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING=stable" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets found. This build uses a temporary key and will NOT install over the previous version."
            echo "SIGNING=temporary" >> "$GITHUB_ENV"
          fi
      - run: gradle assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}
      - uses: actions/upload-artifact@v5
        with:
          name: aod-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="1.1.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "my-aod-$VER.apk"
          gh release create "build-${{ github.run_number }}" "my-aod-$VER.apk" \
            --title "My AOD $VER" --notes "$(git log -1 --pretty=%s) [signing: $SIGNING]" --latest
